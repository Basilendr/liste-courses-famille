<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #20242B; --parchment: #FBF7EE; --ink: #2B2A28; --ink-soft: #6B6862;
        --gold: #C79A3C; --gold-dark: #A97E2C; --blue: #5E7C99; --blue-clair: #E7EDF2;
        --terracotta: #B5654A; --terracotta-clair: #F3E4DE;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; color: var(--ink); background: var(--parchment); }
    .layout { display: flex; min-height: 100vh; }

    aside { width: 220px; flex-shrink: 0; background: var(--navy); padding: 28px 16px; display: flex; flex-direction: column; gap: 28px; }
    .logo { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; color: var(--parchment); margin: 0; padding: 0 8px; }
    nav { display: flex; flex-direction: column; gap: 4px; }
    nav button {
        display: flex; align-items: center; gap: 10px; text-align: left;
        font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
        padding: 11px 12px; border: none; border-radius: 8px; cursor: pointer;
        color: rgba(255,255,255,0.6); background: transparent;
    }
    nav button:hover { background: rgba(255,255,255,0.06); color: white; }
    nav button.actif { color: white; }
    nav button[data-tab="accueil"].actif { background: rgba(255,255,255,0.08); }
    nav button[data-tab="courses"].actif { background: var(--gold); color: var(--navy); }
    nav button[data-tab="planning"].actif { background: var(--blue); }
    nav button[data-tab="taches"].actif { background: var(--terracotta); }

    main { flex: 1; padding: 40px 36px 60px; max-width: 920px; }
    .onglet { display: none; animation: apparition 0.25s ease; }
    .onglet.actif { display: block; }
    @keyframes apparition { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    h1.titre-page { font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; margin: 0 0 4px; }
    .date-jour { color: var(--ink-soft); font-size: 15px; margin: 0 0 32px; text-transform: capitalize; }
    h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 0 0 20px; }

    .tuiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .tuile { background: white; border-radius: 10px; padding: 20px; border-top: 3px solid var(--gold); }
    .tuile.planning { border-top-color: var(--blue); }
    .tuile.taches { border-top-color: var(--terracotta); }
    .tuile .chiffre { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; margin: 0; }
    .tuile .label { font-size: 14px; color: var(--ink-soft); margin: 4px 0 0; }

    input[type="text"], input[type="time"], input[type="number"], select {
        padding: 11px 13px; font-family: 'Inter', sans-serif; font-size: 14px;
        border: 1px solid #E3DBC9; border-radius: 8px; background: white; color: var(--ink);
    }
    input:focus, select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    button.action {
        padding: 12px 20px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
        background: var(--gold); color: white; border: none; border-radius: 8px; cursor: pointer;
    }
    button.action:hover { background: var(--gold-dark); }
    button.action.discret { background: var(--navy); }
    button.lien-discret {
        background: none; border: none; color: var(--ink-soft); font-size: 13px;
        cursor: pointer; text-decoration: underline; padding: 4px;
    }

    ul { list-style: none; padding: 0; margin: 0; background: white; border-radius: 10px; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #EAE3D2; }
    li:last-child { border-bottom: none; }
    li.achete span.nom-article { text-decoration: line-through; color: var(--ink-soft); }
    .gauche { display: flex; align-items: center; gap: 12px; }
    .gauche input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); }
    .supprimer { background: none; border: none; color: var(--ink-soft); font-size: 16px; cursor: pointer; padding: 4px 8px; }
    .supprimer:hover { color: var(--terracotta); }
    .a-venir { color: var(--ink-soft); font-size: 15px; line-height: 1.6; padding: 20px 0; }

    /* ---- Sous-navigation Courses ---- */
    .sous-nav { display: flex; gap: 8px; margin-bottom: 22px; }
    .sous-onglet-btn {
        padding: 10px 16px; border-radius: 20px; border: 1px solid #E3DBC9; background: white;
        font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink-soft); cursor: pointer;
    }
    .sous-onglet-btn.actif { background: var(--navy); color: white; border-color: var(--navy); }
    .sous-onglet { display: none; }
    .sous-onglet.actif { display: block; }

    .ajout-zone-courses {
        display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; align-items: center;
        background: white; padding: 14px; border-radius: 10px;
    }
    .ajout-zone-courses input[name="nom"] { flex: 2; min-width: 160px; }
    .ajout-zone-courses input[name="quantite"] { width: 90px; }
    .ajout-zone-courses select { flex: 1; min-width: 150px; }
    .ajout-zone-courses input[name="note"] { flex: 2; min-width: 180px; }

    .groupe-categorie { margin-bottom: 22px; }
    .groupe-categorie h3 {
        font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; margin: 0 0 8px 2px; color: var(--ink-soft);
    }
    .quantite-badge {
        font-size: 12.5px; color: var(--ink-soft); background: #F1ECDF; padding: 2px 8px; border-radius: 10px; margin-left: 4px;
    }
    .note-article { font-size: 12.5px; color: var(--ink-soft); font-style: italic; display: block; }

    /* ---- Planning ---- */
    .carte-enfant { background: white; border-radius: 10px; padding: 22px; margin-bottom: 28px; border-top: 3px solid var(--blue); }
    .carte-enfant-entete { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .carte-enfant-entete h3 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; margin: 0; }
    .barre-outils-planning { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .ajout-zone { display: flex; gap: 8px; margin-bottom: 24px; }

    .panneau-formulaire {
        display: none; background: #FDFBF5; border: 1px solid #EAE3D2; border-radius: 8px;
        padding: 16px; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; align-items: flex-end;
    }
    .panneau-formulaire.visible { display: flex; }
    .champ-form { display: flex; flex-direction: column; gap: 4px; }
    .champ-form label { font-size: 12px; color: var(--ink-soft); }

    .table-scroll { overflow-x: auto; }
    .planning-semaine { min-width: 680px; }
    .planning-entetes { display: grid; grid-template-columns: 46px repeat(7, 1fr); gap: 2px; margin-bottom: 2px; }
    .planning-entetes .jour-label { text-align: center; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); padding: 4px 0; }
    .planning-grille {
        position: relative; display: grid;
        grid-template-columns: 46px repeat(7, 1fr);
        grid-template-rows: repeat(168, 4px);
        background-image: repeating-linear-gradient(180deg, transparent, transparent 47px, #EFE9DA 47px, #EFE9DA 48px);
        border: 1px solid #EFE9DA; border-radius: 6px; overflow: hidden;
    }
    .heure-label { grid-column: 1; font-size: 11px; color: var(--ink-soft); text-align: right; padding-right: 6px; transform: translateY(-6px); border-right: 1px solid #EFE9DA; }
    .colonne-fond { border-right: 1px solid #F5F0E4; }
    .evenement { border-radius: 5px; padding: 3px 6px; font-size: 11.5px; line-height: 1.25; cursor: pointer; overflow: hidden; margin: 0 2px; }
    .evenement.type-cours { background: var(--blue-clair); border-left: 3px solid var(--blue); color: #33475A; }
    .evenement.type-activite { background: var(--terracotta-clair); border-left: 3px solid var(--terracotta); color: #6E3B29; }
    .evenement strong { display: block; font-weight: 600; }
    .evenement span.heure-evt { font-size: 10.5px; opacity: 0.75; }

    @media (max-width: 700px) {
        .layout { flex-direction: column; }
        aside { width: 100%; flex-direction: row; align-items: center; padding: 16px; gap: 16px; overflow-x: auto; }
        nav { flex-direction: row; }
        main { padding: 28px 20px 50px; }
        .tuiles { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<div class="layout">
    <aside>
        <p class="logo">Notre Famille</p>
        <nav>
            <button class="actif" data-tab="accueil" onclick="changerOnglet('accueil', this)">🏠 Accueil</button>
            <button data-tab="courses" onclick="changerOnglet('courses', this)">🛒 Courses</button>
            <button data-tab="planning" onclick="changerOnglet('planning', this)">📅 Planning</button>
            <button data-tab="taches" onclick="changerOnglet('taches', this)">🧹 Tâches</button>
        </nav>
    </aside>

    <main>
        <section id="accueil" class="onglet actif">
            <h1 class="titre-page">Bonjour !</h1>
            <p class="date-jour" id="dateJour"></p>
            <div class="tuiles">
                <div class="tuile courses">
                    <p class="chiffre" id="compteurCourses">–</p>
                    <p class="label">articles à acheter</p>
                </div>
                <div class="tuile planning">
                    <p class="chiffre" id="compteurEnfants">–</p>
                    <p class="label">enfant(s) dans le planning</p>
                </div>
                <div class="tuile taches">
                    <p class="chiffre">–</p>
                    <p class="label">les tâches arrivent bientôt</p>
                </div>
            </div>
        </section>

        <section id="courses" class="onglet">
            <h2>Courses</h2>
            <div class="sous-nav">
                <button class="sous-onglet-btn actif" data-sous="semaine" onclick="changerSousOnglet('semaine', this)">🗓️ Courses de la semaine</button>
                <button class="sous-onglet-btn" data-sous="specifiques" onclick="changerSousOnglet('specifiques', this)">🎁 Achats spécifiques</button>
            </div>

            <!-- Courses de la semaine -->
            <div id="semaine" class="sous-onglet actif">
                <div class="ajout-zone-courses">
                    <input type="text" name="nom" id="semaineNom" placeholder="Article (ex : Lait)">
                    <input type="text" name="quantite" id="semaineQuantite" placeholder="Qté (ex : x2)">
                    <select id="semaineCategorie">
                        <option value="fruits_legumes">🥦 Fruits & Légumes</option>
                        <option value="cremerie">🥛 Crémerie</option>
                        <option value="epicerie">🍞 Épicerie & Boulangerie</option>
                        <option value="boissons">🥤 Boissons</option>
                        <option value="hygiene">🧴 Hygiène & Entretien</option>
                        <option value="surgeles">❄️ Surgelés</option>
                        <option value="autre">📦 Autre</option>
                    </select>
                    <button class="action" onclick="ajouterArticleSemaine()">Ajouter</button>
                </div>
                <div id="listeSemaine"></div>
            </div>

            <!-- Achats spécifiques -->
            <div id="specifiques" class="sous-onglet">
                <div class="ajout-zone-courses">
                    <input type="text" name="nom" id="specifiqueNom" placeholder="Article (ex : Livre pour Léa)">
                    <input type="text" name="note" id="specifiqueNote" placeholder="Note (ex : à commander en ligne)">
                    <button class="action" onclick="ajouterArticleSpecifique()">Ajouter</button>
                </div>
                <ul id="listeSpecifiques"></ul>
            </div>
        </section>

        <section id="planning" class="onglet">
            <h2>Planning familial</h2>
            <div class="ajout-zone">
                <input type="text" id="nouvelEnfant" placeholder="Prénom de l'enfant...">
                <button class="action" onclick="ajouterEnfant()">Ajouter un enfant</button>
            </div>
            <div id="listeEnfants"></div>
        </section>

        <section id="taches" class="onglet">
            <h2>Tâches ménagères</h2>
            <p class="a-venir">La rotation automatique des tâches arrive à la prochaine étape.</p>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDzd-fjLhHx2FRXdcnGZy4G27yGF_h9els",
        authDomain: "liste-courses-famille-a0096.firebaseapp.com",
        projectId: "liste-courses-famille-a0096",
        storageBucket: "liste-courses-famille-a0096.firebasestorage.app",
        messagingSenderId: "631053249612",
        appId: "1:631053249612:web:51d4ede9f7331ff22058e9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* ================= COURSES : SEMAINE (par catégorie) ================= */
    const semaineRef = collection(db, "coursesSemaine");
    const CATEGORIES = {
        fruits_legumes: "🥦 Fruits & Légumes",
        cremerie: "🥛 Crémerie",
        epicerie: "🍞 Épicerie & Boulangerie",
        boissons: "🥤 Boissons",
        hygiene: "🧴 Hygiène & Entretien",
        surgeles: "❄️ Surgelés",
        autre: "📦 Autre"
    };
    const ORDRE_CATEGORIES = ["fruits_legumes","cremerie","epicerie","boissons","hygiene","surgeles","autre"];

    window.ajouterArticleSemaine = async function() {
        const nomInput = document.getElementById("semaineNom");
        const quantiteInput = document.getElementById("semaineQuantite");
        const categorieSelect = document.getElementById("semaineCategorie");
        const nom = nomInput.value.trim();
        if (nom === "") return;
        await addDoc(semaineRef, {
            nom, quantite: quantiteInput.value.trim(), categorie: categorieSelect.value,
            achete: false, dateAjout: Date.now()
        });
        nomInput.value = "";
        quantiteInput.value = "";
        nomInput.focus();
    };
    window.toggleAcheteSemaine = async function(id, etatActuel) {
        await updateDoc(doc(db, "coursesSemaine", id), { achete: !etatActuel });
    };
    window.supprimerArticleSemaine = async function(id) {
        await deleteDoc(doc(db, "coursesSemaine", id));
    };

    onSnapshot(semaineRef, (snapshot) => {
        const conteneur = document.getElementById("listeSemaine");
        conteneur.innerHTML = "";
        const articles = [];
        snapshot.forEach((d) => articles.push({ id: d.id, ...d.data() }));
        articles.sort((a, b) => a.dateAjout - b.dateAjout);

        ORDRE_CATEGORIES.forEach(cat => {
            const articlesCat = articles.filter(a => (a.categorie || "autre") === cat);
            if (articlesCat.length === 0) return;

            const groupe = document.createElement("div");
            groupe.className = "groupe-categorie";
            let items = "";
            articlesCat.forEach(article => {
                items += `
                    <li class="${article.achete ? 'achete' : ''}">
                        <div class="gauche">
                            <input type="checkbox" ${article.achete ? "checked" : ""}
                                   onchange="toggleAcheteSemaine('${article.id}', ${article.achete})">
                            <span class="nom-article">${article.nom}</span>
                            ${article.quantite ? `<span class="quantite-badge">${article.quantite}</span>` : ""}
                        </div>
                        <button class="supprimer" onclick="supprimerArticleSemaine('${article.id}')">✕</button>
                    </li>
                `;
            });
            groupe.innerHTML = `<h3>${CATEGORIES[cat]}</h3><ul>${items}</ul>`;
            conteneur.appendChild(groupe);
        });

        document.getElementById("compteurCourses").textContent =
            articles.filter(a => !a.achete).length + (window._compteurSpecifiques || 0);
    });

    document.getElementById("semaineNom").addEventListener("keypress", (e) => {
        if (e.key === "Enter") ajouterArticleSemaine();
    });

    /* ================= COURSES : ACHATS SPÉCIFIQUES ================= */
    const specifiquesRef = collection(db, "achatsSpecifiques");

    window.ajouterArticleSpecifique = async function() {
        const nomInput = document.getElementById("specifiqueNom");
        const noteInput = document.getElementById("specifiqueNote");
        const nom = nomInput.value.trim();
        if (nom === "") return;
        await addDoc(specifiquesRef, {
            nom, note: noteInput.value.trim(), achete: false, dateAjout: Date.now()
        });
        nomInput.value = "";
        noteInput.value = "";
        nomInput.focus();
    };
    window.toggleAcheteSpecifique = async function(id, etatActuel) {
        await updateDoc(doc(db, "achatsSpecifiques", id), { achete: !etatActuel });
    };
    window.supprimerArticleSpecifique = async function(id) {
        await deleteDoc(doc(db, "achatsSpecifiques", id));
    };

    onSnapshot(specifiquesRef, (snapshot) => {
        const liste = document.getElementById("listeSpecifiques");
        liste.innerHTML = "";
        const articles = [];
        snapshot.forEach((d) => articles.push({ id: d.id, ...d.data() }));
        articles.sort((a, b) => a.dateAjout - b.dateAjout);

        articles.forEach((article) => {
            const li = document.createElement("li");
            if (article.achete) li.classList.add("achete");
            li.innerHTML = `
                <div class="gauche">
                    <input type="checkbox" ${article.achete ? "checked" : ""}
                           onchange="toggleAcheteSpecifique('${article.id}', ${article.achete})">
                    <div>
                        <span class="nom-article">${article.nom}</span>
                        ${article.note ? `<span class="note-article">${article.note}</span>` : ""}
                    </div>
                </div>
                <button class="supprimer" onclick="supprimerArticleSpecifique('${article.id}')">✕</button>
            `;
            liste.appendChild(li);
        });

        window._compteurSpecifiques = articles.filter(a => !a.achete).length;
    });

    document.getElementById("specifiqueNom").addEventListener("keypress", (e) => {
        if (e.key === "Enter") ajouterArticleSpecifique();
    });

    /* ================= SOUS-NAVIGATION COURSES ================= */
    window.changerSousOnglet = function(nom, btn) {
        document.querySelectorAll(".sous-onglet").forEach(el => el.classList.remove("actif"));
        document.querySelectorAll(".sous-onglet-btn").forEach(el => el.classList.remove("actif"));
        document.getElementById(nom).classList.add("actif");
        btn.classList.add("actif");
    };

    /* ================= PLANNING ================= */
    const enfantsRef = collection(db, "enfants");
    const JOURS = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
    const JOURS_LABEL = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
    const HEURE_DEBUT_GRILLE = 7;
    const HEURE_FIN_GRILLE = 21;
    const LIGNES_PAR_HEURE = 12;
    const TOTAL_LIGNES = (HEURE_FIN_GRILLE - HEURE_DEBUT_GRILLE) * LIGNES_PAR_HEURE;

    let enfantsActuels = [];

    function genererId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function heureVersMinutes(hhmm) {
        const [h, m] = hhmm.split(":").map(Number);
        return h * 60 + m;
    }
    function minutesVersLigne(minutesDepuisMinuit) {
        const minutesRelatives = minutesDepuisMinuit - HEURE_DEBUT_GRILLE * 60;
        let ligne = Math.round(minutesRelatives / 5) + 1;
        if (ligne < 1) ligne = 1;
        if (ligne > TOTAL_LIGNES + 1) ligne = TOTAL_LIGNES + 1;
        return ligne;
    }

    window.ajouterEnfant = async function() {
        const input = document.getElementById("nouvelEnfant");
        const nom = input.value.trim();
        if (nom === "") return;
        await addDoc(enfantsRef, { nom, evenements: [] });
        input.value = "";
    };
    window.supprimerEnfant = async function(id) {
        await deleteDoc(doc(db, "enfants", id));
    };
    window.toggleFormulaireAjout = function(enfantId) {
        document.getElementById(`form-ajout-${enfantId}`).classList.toggle("visible");
    };
    window.ajouterEvenement = async function(enfantId) {
        const jour = document.getElementById(`ajout-jour-${enfantId}`).value;
        const debut = document.getElementById(`ajout-debut-${enfantId}`).value;
        const fin = document.getElementById(`ajout-fin-${enfantId}`).value;
        const label = document.getElementById(`ajout-label-${enfantId}`).value.trim();
        const type = document.getElementById(`ajout-type-${enfantId}`).value;
        if (!debut || !fin || label === "") { alert("Merci de renseigner l'heure de début, de fin et le nom."); return; }
        if (heureVersMinutes(fin) <= heureVersMinutes(debut)) { alert("L'heure de fin doit être après l'heure de début."); return; }
        const enfant = enfantsActuels.find(e => e.id === enfantId);
        const nouvelEvenement = { id: genererId(), jour, debut, fin, label, type };
        const nouveauxEvenements = [...(enfant.evenements || []), nouvelEvenement];
        await updateDoc(doc(db, "enfants", enfantId), { evenements: nouveauxEvenements });
        document.getElementById(`ajout-label-${enfantId}`).value = "";
        document.getElementById(`form-ajout-${enfantId}`).classList.remove("visible");
    };
    window.ouvrirEditeur = function(enfantId, evenementId) {
        const enfant = enfantsActuels.find(e => e.id === enfantId);
        const evt = enfant.evenements.find(ev => ev.id === evenementId);
        if (!evt) return;
        document.getElementById(`edit-jour-${enfantId}`).value = evt.jour;
        document.getElementById(`edit-debut-${enfantId}`).value = evt.debut;
        document.getElementById(`edit-fin-${enfantId}`).value = evt.fin;
        document.getElementById(`edit-label-${enfantId}`).value = evt.label;
        document.getElementById(`edit-type-${enfantId}`).value = evt.type;
        const panneau = document.getElementById(`form-edit-${enfantId}`);
        panneau.dataset.evenementId = evenementId;
        panneau.classList.add("visible");
        document.getElementById(`form-ajout-${enfantId}`).classList.remove("visible");
    };
    window.enregistrerEvenement = async function(enfantId) {
        const panneau = document.getElementById(`form-edit-${enfantId}`);
        const evenementId = panneau.dataset.evenementId;
        const jour = document.getElementById(`edit-jour-${enfantId}`).value;
        const debut = document.getElementById(`edit-debut-${enfantId}`).value;
        const fin = document.getElementById(`edit-fin-${enfantId}`).value;
        const label = document.getElementById(`edit-label-${enfantId}`).value.trim();
        const type = document.getElementById(`edit-type-${enfantId}`).value;
        if (!debut || !fin || label === "") { alert("Merci de renseigner l'heure de début, de fin et le nom."); return; }
        if (heureVersMinutes(fin) <= heureVersMinutes(debut)) { alert("L'heure de fin doit être après l'heure de début."); return; }
        const enfant = enfantsActuels.find(e => e.id === enfantId);
        const nouveauxEvenements = enfant.evenements.map(ev =>
            ev.id === evenementId ? { id: evenementId, jour, debut, fin, label, type } : ev
        );
        await updateDoc(doc(db, "enfants", enfantId), { evenements: nouveauxEvenements });
        panneau.classList.remove("visible");
    };
    window.supprimerEvenement = async function(enfantId) {
        const panneau = document.getElementById(`form-edit-${enfantId}`);
        const evenementId = panneau.dataset.evenementId;
        const enfant = enfantsActuels.find(e => e.id === enfantId);
        const nouveauxEvenements = enfant.evenements.filter(ev => ev.id !== evenementId);
        await updateDoc(doc(db, "enfants", enfantId), { evenements: nouveauxEvenements });
        panneau.classList.remove("visible");
    };
    window.fermerEditeur = function(enfantId) {
        document.getElementById(`form-edit-${enfantId}`).classList.remove("visible");
    };

    function construireGrille(enfant) {
        const evenements = enfant.evenements || [];
        let labelsHeures = "";
        for (let h = HEURE_DEBUT_GRILLE; h < HEURE_FIN_GRILLE; h++) {
            const ligneDebut = (h - HEURE_DEBUT_GRILLE) * LIGNES_PAR_HEURE + 1;
            labelsHeures += `<div class="heure-label" style="grid-row:${ligneDebut} / span ${LIGNES_PAR_HEURE};">${h}h</div>`;
        }
        let colonnesFond = "";
        for (let c = 0; c < 7; c++) {
            colonnesFond += `<div class="colonne-fond" style="grid-column:${c + 2}; grid-row: 1 / ${TOTAL_LIGNES + 1};"></div>`;
        }
        let blocsEvenements = "";
        evenements.forEach(evt => {
            const colIndex = JOURS.indexOf(evt.jour) + 2;
            const ligneDebut = minutesVersLigne(heureVersMinutes(evt.debut));
            const ligneFin = minutesVersLigne(heureVersMinutes(evt.fin));
            blocsEvenements += `
                <div class="evenement type-${evt.type}"
                     style="grid-column:${colIndex}; grid-row:${ligneDebut} / ${ligneFin};"
                     onclick="ouvrirEditeur('${enfant.id}', '${evt.id}')">
                    <strong>${evt.label}</strong>
                    <span class="heure-evt">${evt.debut}–${evt.fin}</span>
                </div>
            `;
        });
        let entetesJours = "";
        JOURS_LABEL.forEach(j => entetesJours += `<div class="jour-label">${j}</div>`);
        return `
            <div class="planning-semaine">
                <div class="planning-entetes"><div></div>${entetesJours}</div>
                <div class="planning-grille">${labelsHeures}${colonnesFond}${blocsEvenements}</div>
            </div>
        `;
    }
    function optionsJours() {
        return JOURS.map((j, i) => `<option value="${j}">${JOURS_LABEL[i]}</option>`).join("");
    }
    function construireFormulaire(prefixe, enfantId, boutons) {
        return `
            <div class="champ-form"><label>Jour</label><select id="${prefixe}-jour-${enfantId}">${optionsJours()}</select></div>
            <div class="champ-form"><label>Début</label><input type="time" id="${prefixe}-debut-${enfantId}"></div>
            <div class="champ-form"><label>Fin</label><input type="time" id="${prefixe}-fin-${enfantId}"></div>
            <div class="champ-form" style="flex:1; min-width:140px;"><label>Nom (matière / activité)</label><input type="text" id="${prefixe}-label-${enfantId}" placeholder="Ex : Mathématiques"></div>
            <div class="champ-form"><label>Type</label><select id="${prefixe}-type-${enfantId}"><option value="cours">Cours</option><option value="activite">Activité</option></select></div>
            ${boutons}
        `;
    }
    function render() {
        const conteneur = document.getElementById("listeEnfants");
        conteneur.innerHTML = "";
        enfantsActuels.forEach((enfant) => {
            const carte = document.createElement("div");
            carte.className = "carte-enfant";
            carte.innerHTML = `
                <div class="carte-enfant-entete">
                    <h3>${enfant.nom}</h3>
                    <button class="supprimer" onclick="supprimerEnfant('${enfant.id}')">✕ Retirer</button>
                </div>
                <div class="barre-outils-planning">
                    <button class="action" onclick="toggleFormulaireAjout('${enfant.id}')">+ Ajouter un créneau</button>
                </div>
                <div class="panneau-formulaire" id="form-ajout-${enfant.id}">
                    ${construireFormulaire("ajout", enfant.id, `<button class="action" onclick="ajouterEvenement('${enfant.id}')">Ajouter</button>`)}
                </div>
                <div class="panneau-formulaire" id="form-edit-${enfant.id}">
                    ${construireFormulaire("edit", enfant.id, `
                        <button class="action" onclick="enregistrerEvenement('${enfant.id}')">Enregistrer</button>
                        <button class="action discret" onclick="supprimerEvenement('${enfant.id}')">Supprimer</button>
                        <button class="lien-discret" onclick="fermerEditeur('${enfant.id}')">Annuler</button>
                    `)}
                </div>
                <div class="table-scroll">${construireGrille(enfant)}</div>
            `;
            conteneur.appendChild(carte);
        });
        document.getElementById("compteurEnfants").textContent = enfantsActuels.length;
    }
    onSnapshot(enfantsRef, (snapshot) => {
        enfantsActuels = [];
        snapshot.forEach((d) => enfantsActuels.push({ id: d.id, ...d.data() }));
        render();
    });

    /* ================= NAVIGATION PRINCIPALE ================= */
    window.changerOnglet = function(nom, btn) {
        document.querySelectorAll(".onglet").forEach(el => el.classList.remove("actif"));
        document.querySelectorAll("aside nav button").forEach(el => el.classList.remove("actif"));
        document.getElementById(nom).classList.add("actif");
        btn.classList.add("actif");
    };

    /* ================= DATE DU JOUR ================= */
    const nomsJours = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
    const nomsMois = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
    const aujourdhui = new Date();
    document.getElementById("dateJour").textContent =
        `${nomsJours[aujourdhui.getDay()]} ${aujourdhui.getDate()} ${nomsMois[aujourdhui.getMonth()]}`;
</script>
</body>
</html>
