<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #20242B; --parchment: #FBF7EE; --ink: #2B2A28; --ink-soft: #6B6862;
        --gold: #C79A3C; --gold-dark: #A97E2C; --blue: #5E7C99; --terracotta: #B5654A;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; color: var(--ink); background: var(--parchment); }
    .layout { display: flex; min-height: 100vh; }

    aside { width: 220px; flex-shrink: 0; background: var(--navy); padding: 28px 16px; display: flex; flex-direction: column; gap: 28px; }
    .logo { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; color: var(--parchment); margin: 0; padding: 0 8px; }
    nav { display: flex; flex-direction: column; gap: 4px; }
    nav button {
        display: flex; align-items: center; gap: 10px; text-align: left;
        font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
        padding: 11px 12px; border: none; border-radius: 8px; cursor: pointer;
        color: rgba(255,255,255,0.6); background: transparent;
    }
    nav button:hover { background: rgba(255,255,255,0.06); color: white; }
    nav button.actif { color: white; }
    nav button[data-tab="accueil"].actif { background: rgba(255,255,255,0.08); }
    nav button[data-tab="courses"].actif { background: var(--gold); color: var(--navy); }
    nav button[data-tab="planning"].actif { background: var(--blue); }
    nav button[data-tab="taches"].actif { background: var(--terracotta); }

    main { flex: 1; padding: 40px 36px 60px; max-width: 840px; }
    .onglet { display: none; animation: apparition 0.25s ease; }
    .onglet.actif { display: block; }
    @keyframes apparition { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    h1.titre-page { font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; margin: 0 0 4px; }
    .date-jour { color: var(--ink-soft); font-size: 15px; margin: 0 0 32px; text-transform: capitalize; }
    h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 0 0 20px; }
    h3.soustitre { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; margin: 24px 0 12px; color: var(--ink-soft); }

    .tuiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .tuile { background: white; border-radius: 10px; padding: 20px; border-top: 3px solid var(--gold); }
    .tuile.planning { border-top-color: var(--blue); }
    .tuile.taches { border-top-color: var(--terracotta); }
    .tuile .chiffre { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; margin: 0; }
    .tuile .label { font-size: 14px; color: var(--ink-soft); margin: 4px 0 0; }

    .ajout-zone { display: flex; gap: 8px; margin-bottom: 24px; }
    input[type="text"] {
        padding: 12px 14px; font-family: 'Inter', sans-serif; font-size: 15px;
        border: 1px solid #E3DBC9; border-radius: 8px; background: white; color: var(--ink);
    }
    .ajout-zone input[type="text"] { flex: 1; }
    input[type="text"]:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    button.action {
        padding: 12px 20px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
        background: var(--gold); color: white; border: none; border-radius: 8px; cursor: pointer;
    }
    button.action:hover { background: var(--gold-dark); }

    ul { list-style: none; padding: 0; margin: 0; background: white; border-radius: 10px; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #EAE3D2; }
    li:last-child { border-bottom: none; }
    li.achete span { text-decoration: line-through; color: var(--ink-soft); }
    .gauche { display: flex; align-items: center; gap: 12px; }
    .gauche input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); }
    .supprimer { background: none; border: none; color: var(--ink-soft); font-size: 16px; cursor: pointer; padding: 4px 8px; }
    .supprimer:hover { color: var(--terracotta); }
    .a-venir { color: var(--ink-soft); font-size: 15px; line-height: 1.6; padding: 20px 0; }

    /* Planning */
    .carte-enfant { background: white; border-radius: 10px; padding: 20px; margin-bottom: 24px; border-top: 3px solid var(--blue); }
    .carte-enfant-entete { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .carte-enfant-entete h3 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 0; }

    .table-scroll { overflow-x: auto; }
    table.grille-cours { border-collapse: collapse; font-size: 13px; width: 100%; min-width: 520px; }
    table.grille-cours th {
        text-align: center; font-weight: 500; color: var(--ink-soft); font-size: 12.5px;
        padding: 8px 6px; border-bottom: 2px solid #EAE3D2; background: #FDFBF5;
    }
    table.grille-cours th:first-child { text-align: left; width: 78px; }
    table.grille-cours td { padding: 4px; border-bottom: 1px solid #F1ECDF; }
    table.grille-cours td.heure { font-weight: 500; color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; padding-left: 8px; }
    table.grille-cours input[type="text"] {
        width: 100%; padding: 7px 8px; font-size: 12.5px; border: 1px solid #E3DBC9;
        border-radius: 6px; background: #FDFBF5; text-align: center;
    }

    .grille-soir { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .case-soir { display: flex; flex-direction: column; gap: 4px; }
    .case-soir label { font-size: 12px; color: var(--ink-soft); text-align: center; }
    .case-soir input[type="text"] {
        padding: 8px 6px; font-size: 12.5px; border: 1px solid #E3DBC9; border-radius: 6px;
        background: #FDFBF5; text-align: center; width: 100%;
    }

    @media (max-width: 700px) {
        .layout { flex-direction: column; }
        aside { width: 100%; flex-direction: row; align-items: center; padding: 16px; gap: 16px; overflow-x: auto; }
        nav { flex-direction: row; }
        main { padding: 28px 20px 50px; }
        .tuiles { grid-template-columns: 1fr; }
        .grille-soir { grid-template-columns: repeat(4, 1fr); }
    }
</style>
</head>
<body>

<div class="layout">
    <aside>
        <p class="logo">Notre Famille</p>
        <nav>
            <button class="actif" data-tab="accueil" onclick="changerOnglet('accueil', this)">🏠 Accueil</button>
            <button data-tab="courses" onclick="changerOnglet('courses', this)">🛒 Courses</button>
            <button data-tab="planning" onclick="changerOnglet('planning', this)">📅 Planning</button>
            <button data-tab="taches" onclick="changerOnglet('taches', this)">🧹 Tâches</button>
        </nav>
    </aside>

    <main>
        <section id="accueil" class="onglet actif">
            <h1 class="titre-page">Bonjour !</h1>
            <p class="date-jour" id="dateJour"></p>
            <div class="tuiles">
                <div class="tuile courses">
                    <p class="chiffre" id="compteurCourses">–</p>
                    <p class="label">articles à acheter</p>
                </div>
                <div class="tuile planning">
                    <p class="chiffre" id="compteurEnfants">–</p>
                    <p class="label">enfant(s) dans le planning</p>
                </div>
                <div class="tuile taches">
                    <p class="chiffre">–</p>
                    <p class="label">les tâches arrivent bientôt</p>
                </div>
            </div>
        </section>

        <section id="courses" class="onglet">
            <h2>Liste de courses</h2>
            <div class="ajout-zone">
                <input type="text" id="nouvelArticle" placeholder="Ajouter un article...">
                <button class="action" onclick="ajouterArticle()">Ajouter</button>
            </div>
            <ul id="listeArticles"></ul>
        </section>

        <section id="planning" class="onglet">
            <h2>Planning familial</h2>
            <div class="ajout-zone">
                <input type="text" id="nouvelEnfant" placeholder="Prénom de l'enfant...">
                <button class="action" onclick="ajouterEnfant()">Ajouter un enfant</button>
            </div>
            <div id="listeEnfants"></div>
        </section>

        <section id="taches" class="onglet">
            <h2>Tâches ménagères</h2>
            <p class="a-venir">La rotation automatique des tâches arrive à la prochaine étape.</p>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDzd-fjLhHx2FRXdcnGZy4G27yGF_h9els",
        authDomain: "liste-courses-famille-a0096.firebaseapp.com",
        projectId: "liste-courses-famille-a0096",
        storageBucket: "liste-courses-famille-a0096.firebasestorage.app",
        messagingSenderId: "631053249612",
        appId: "1:631053249612:web:51d4ede9f7331ff22058e9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* ---------- COURSES ---------- */
    const articlesRef = collection(db, "articles");
    window.ajouterArticle = async function() {
        const input = document.getElementById("nouvelArticle");
        const texte = input.value.trim();
        if (texte === "") return;
        await addDoc(articlesRef, { nom: texte, achete: false, dateAjout: Date.now() });
        input.value = "";
    };
    window.toggleAchete = async function(id, etatActuel) {
        await updateDoc(doc(db, "articles", id), { achete: !etatActuel });
    };
    window.supprimerArticle = async function(id) {
        await deleteDoc(doc(db, "articles", id));
    };
    onSnapshot(articlesRef, (snapshot) => {
        const liste = document.getElementById("listeArticles");
        liste.innerHTML = "";
        const articles = [];
        snapshot.forEach((docSnap) => articles.push({ id: docSnap.id, ...docSnap.data() }));
        articles.sort((a, b) => a.dateAjout - b.dateAjout);
        articles.forEach((article) => {
            const li = document.createElement("li");
            if (article.achete) li.classList.add("achete");
            li.innerHTML = `
                <div class="gauche">
                    <input type="checkbox" ${article.achete ? "checked" : ""}
                           onchange="toggleAchete('${article.id}', ${article.achete})">
                    <span>${article.nom}</span>
                </div>
                <button class="supprimer" onclick="supprimerArticle('${article.id}')">✕</button>
            `;
            liste.appendChild(li);
        });
        document.getElementById("compteurCourses").textContent = articles.filter(a => !a.achete).length;
    });
    document.getElementById("nouvelArticle").addEventListener("keypress", (e) => {
        if (e.key === "Enter") ajouterArticle();
    });

    /* ---------- PLANNING ---------- */
    const enfantsRef = collection(db, "enfants");

    const joursEcole = ["lundi", "mardi", "mercredi", "jeudi", "vendredi"];
    const joursEcoleAffiches = ["Lun", "Mar", "Mer", "Jeu", "Ven"];
    const creneaux = ["8h-9h", "9h-10h", "10h-11h", "11h-12h", "14h-15h", "15h-16h", "16h-17h"];

    const joursSemaine = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
    const joursSemaineAffiches = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];

    function planningVide() {
        const cours = {};
        joursEcole.forEach(j => {
            cours[j] = {};
            creneaux.forEach(c => cours[j][c] = "");
        });
        const soir = {};
        joursSemaine.forEach(j => soir[j] = "");
        return { cours, soir };
    }

    window.ajouterEnfant = async function() {
        const input = document.getElementById("nouvelEnfant");
        const nom = input.value.trim();
        if (nom === "") return;
        await addDoc(enfantsRef, { nom: nom, planning: planningVide() });
        input.value = "";
    };

    window.supprimerEnfant = async function(id) {
        await deleteDoc(doc(db, "enfants", id));
    };

    window.mettreAJourCours = async function(id, planningActuel, jour, creneau, valeur) {
        const p = JSON.parse(JSON.stringify(planningActuel));
        p.cours[jour][creneau] = valeur;
        await updateDoc(doc(db, "enfants", id), { planning: p });
    };

    window.mettreAJourSoir = async function(id, planningActuel, jour, valeur) {
        const p = JSON.parse(JSON.stringify(planningActuel));
        p.soir[jour] = valeur;
        await updateDoc(doc(db, "enfants", id), { planning: p });
    };

    onSnapshot(enfantsRef, (snapshot) => {
        const conteneur = document.getElementById("listeEnfants");
        conteneur.innerHTML = "";
        const enfants = [];
        snapshot.forEach((docSnap) => enfants.push({ id: docSnap.id, ...docSnap.data() }));

        enfants.forEach((enfant) => {
            const planning = enfant.planning && enfant.planning.cours ? enfant.planning : planningVide();
            const carte = document.createElement("div");
            carte.className = "carte-enfant";

            // Entête de tableau (jours)
            let enteteJours = "";
            joursEcoleAffiches.forEach(j => enteteJours += `<th>${j}</th>`);

            // Lignes par créneau horaire
            let lignes = "";
            creneaux.forEach(creneau => {
                let cellules = "";
                joursEcole.forEach(jour => {
                    const val = (planning.cours[jour] && planning.cours[jour][creneau]) || "";
                    cellules += `<td><input type="text" value="${val}" placeholder="—"
                        data-jour="${jour}" data-creneau="${creneau}"></td>`;
                });
                lignes += `<tr><td class="heure">${creneau}</td>${cellules}</tr>`;
            });

            // Activités du soir
            let casesSoir = "";
            joursSemaine.forEach((jour, i) => {
                const val = planning.soir[jour] || "";
                casesSoir += `
                    <div class="case-soir">
                        <label>${joursSemaineAffiches[i]}</label>
                        <input type="text" value="${val}" placeholder="—" data-jour-soir="${jour}">
                    </div>
                `;
            });

            carte.innerHTML = `
                <div class="carte-enfant-entete">
                    <h3>${enfant.nom}</h3>
                    <button class="supprimer" onclick="supprimerEnfant('${enfant.id}')">✕ Retirer</button>
                </div>
                <h3 class="soustitre">Emploi du temps scolaire</h3>
                <div class="table-scroll">
                    <table class="grille-cours">
                        <thead><tr><th></th>${enteteJours}</tr></thead>
                        <tbody>${lignes}</tbody>
                    </table>
                </div>
                <h3 class="soustitre">Activités du soir</h3>
                <div class="grille-soir">${casesSoir}</div>
            `;

            carte.querySelectorAll("input[data-creneau]").forEach(input => {
                input.addEventListener("change", (e) => {
                    window.mettreAJourCours(enfant.id, planning, e.target.dataset.jour, e.target.dataset.creneau, e.target.value);
                });
            });
            carte.querySelectorAll("input[data-jour-soir]").forEach(input => {
                input.addEventListener("change", (e) => {
                    window.mettreAJourSoir(enfant.id, planning, e.target.dataset.jourSoir, e.target.value);
                });
            });

            conteneur.appendChild(carte);
        });

        document.getElementById("compteurEnfants").textContent = enfants.length;
    });

    /* ---------- NAVIGATION ---------- */
    window.changerOnglet = function(nom, btn) {
        document.querySelectorAll(".onglet").forEach(el => el.classList.remove("actif"));
        document.querySelectorAll("nav button").forEach(el => el.classList.remove("actif"));
        document.getElementById(nom).classList.add("actif");
        btn.classList.add("actif");
    };

    /* ---------- DATE DU JOUR ---------- */
    const nomsJours = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
    const nomsMois = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
    const aujourdhui = new Date();
    document.getElementById("dateJour").textContent =
        `${nomsJours[aujourdhui.getDay()]} ${aujourdhui.getDate()} ${nomsMois[aujourdhui.getMonth()]}`;
</script>
</body>
</html>
